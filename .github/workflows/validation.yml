name: Osler deterministic checks
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/osler-validation.test.js
      - run: node --check app.js
      - run: node --check score-ui.js
      - run: node --check clinical-scores.js
      - run: node --check osler-validation.js
